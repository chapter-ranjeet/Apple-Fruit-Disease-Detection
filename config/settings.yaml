# AppleGuard AI project configuration.
# Dataset class names must be added only after inspecting the supplied annotations.

project:
  name: AppleGuard AI
  title: Apple Fruit Disease Detection Using YOLO
  seed: 42

paths:
  dataset_root: dataset_final
  images_root: dataset_final
  labels_root: null
  models_dir: models
  results_dir: results

model:
  task: classify
  baseline: yolo11n-cls.pt
  optional_comparison: yolo11s-cls.pt
  image_size: 224
  classes: 4
  class_names:
    - Blotch_Apple
    - Normal_Apple
    - Rot_Apple
    - Scab_Apple
  epochs: 100
  batch: -1
  patience: 20
  workers: 0
  device: auto

inference:
  confidence: 0.25
  iou: 0.45
